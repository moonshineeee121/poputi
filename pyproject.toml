[project]
name = "poputi"
version = "0.1.0"
description = "Авторские путешествия с бронированием мест и BDD-проверками"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-bdd>=8.1,<10",
  "pytest-django>=4.9,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = ["concurrency: реальные конкурентные транзакции PostgreSQL"]
