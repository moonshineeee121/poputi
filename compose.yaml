services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: poputi
      POSTGRES_PASSWORD: poputi_dev
      POSTGRES_DB: poputi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poputi -d poputi"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
